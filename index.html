<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소상공인 세무앱 통합 페르소나 정의서</title>
    <style>
        /* 기본 스타일 초기화 및 폰트 설정 */
        body {
            font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
            /* 세로 스크롤 스냅 설정 */
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }

        /* 각 페르소나 섹션 (화면 하나 꽉 채움) */
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start; /* 스크롤 정지 지점 */
            box-sizing: border-box;
            padding: 20px;
        }

        /* 페르소나 1 (순자씨) 배경색 */
        #persona1 {
            background-color: #fdfcfe; /* 아주 연한 보라빛 우아함 */
        }

        /* 페르소나 2 (민우씨) 배경색 */
        #persona2 {
            background-color: #f0f8ff; /* 앨리스 블루, 신뢰와 기술 */
        }

        /* 카드 스타일 */
        .persona-card {
            background-color: white;
            border-radius: 20px;
            width: 100%;
            max-width: 1100px;
            height: 90vh; /* 카드 높이 */
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 내부 스크롤 허용 */
            box-sizing: border-box;
        }

        /* 헤더 스타일 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #007bff;
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-shrink: 0; /* 헤더 높이 고정 */
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
        }

        #persona1 .header h1 { color: #8a2be2; /* 블루 바이올렛 */ }
        #persona1 .header { border-bottom-color: #8a2be2; }
        
        #persona2 .header h1 { color: #0056b3; /* 진한 파랑 */ }
        #persona2 .header { border-bottom-color: #0056b3; }

        .header h2 {
            margin: 0;
            font-size: 1.4em;
            color: #555;
            font-weight: normal;
        }

        /* 메인 콘텐츠 영역 (스크롤 가능) */
        .content {
            display: flex;
            gap: 35px;
            flex: 1;
            overflow-y: auto; /* 내용 많을 때 내부 스크롤 */
            padding-right: 15px;
            box-sizing: border-box;
        }

        /* 스크롤바 스타일링 */
        .content::-webkit-scrollbar {
            width: 8px;
        }
        .content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .content::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        #persona1 .content::-webkit-scrollbar-thumb { background: #c39bd3; }
        #persona2 .content::-webkit-scrollbar-thumb { background: #a9cce3; }

        /* 왼쪽 프로필 영역 */
        .content-left {
            flex: 0 0 300px; /* 너비 고정 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 250px;
            height: 250px;
            border-radius: 50%; /* 원형 */
            object-fit: cover;
            border: 8px solid #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        #persona1 .profile-img { border-color: #f5eef8; }
        #persona2 .profile-img { border-color: #eaf2f8; }

        .basic-info {
            width: 100%;
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-sizing: border-box;
        }

        .basic-info ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .basic-info li {
            margin-bottom: 15px;
            display: flex;
            font-size: 1em;
            line-height: 1.4;
        }

        .basic-info li:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: bold;
            width: 90px;
            color: #555;
            display: inline-block;
            flex-shrink: 0;
        }

        .info-value {
            color: #333;
        }

        /* 오른쪽 상세 정보 영역 */
        .content-right {
            flex: 1;
        }

        /* 섹션 제목 스타일 */
        .section-title {
            font-weight: bold;
            font-size: 1.25em;
            margin-top: 0;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 22px;
            margin-right: 12px;
            border-radius: 4px;
        }

        #persona1 .section-title { color: #8a2be2; }
        #persona1 .section-title::before { background-color: #8a2be2; }

        #persona2 .section-title { color: #0056b3; }
        #persona2 .section-title::before { background-color: #0056b3; }

        /* 일반 텍스트 스타일 */
        .story-text, .lifestyle-detail ul {
            color: #444;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .lifestyle-detail ul {
            padding-left: 20px;
            margin-top: 0;
        }

        .lifestyle-detail li {
            margin-bottom: 10px;
        }

        /* 라이프스타일 강조 박스 */
        .lifestyle-box {
            background-color: #fff;
            border: 2px solid;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        #persona1 .lifestyle-box {
            border-color: #e6e6fa; /* 라벤더 */
            background-color: #fdfcfe;
        }

        #persona2 .lifestyle-box {
            border-color: #d6eaf8; /* 연한 파랑 */
            background-color: #f0f8ff;
        }

        .lifestyle-item {
            margin-bottom: 20px;
        }

        .lifestyle-item:last-child {
            margin-bottom: 0;
        }

        .lifestyle-label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .lifestyle-desc {
            color: #555;
            font-size: 0.95em;
            line-height: 1.6;
            margin: 0;
        }

        /* 앱에 대한 기대 (강조 박스) */
        .app-expectations {
            color: #333;
            line-height: 1.8;
            font-size: 1em;
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid;
            font-weight: 500;
        }

        #persona1 .app-expectations {
            background-color: #f9f0ff;
            border-left-color: #8a2be2;
        }

        #persona2 .app-expectations {
            background-color: #e6f3ff;
            border-left-color: #007bff;
        }

        /* 인쇄 스타일 (A4 한 장에 하나씩) */
        @media print {
            body {
                background-color: white;
                scroll-snap-type: none;
                overflow-y: visible;
                height: auto;
            }
            .container {
                height: auto;
                page-break-after: always; /* 페이지 나눔 */
                display: block;
                margin: 0;
                padding: 0;
            }
            .persona-card {
                box-shadow: none;
                border: 1px solid #ccc;
                width: 100%;
                height: auto;
                margin: 0;
                padding: 30px;
                overflow: visible;
                display: block;
            }
            .header {
                border-bottom-width: 2px;
            }
            .content {
                overflow-y: visible;
                display: block;
                padding-right: 0;
            }
            .content-left {
                width: 100%;
                display: block;
                text-align: center;
                margin-bottom: 30px;
            }
            .profile-img {
                width: 150px;
                height: 150px;
                margin: 0 auto 20px;
            }
            .basic-info {
                text-align: left;
                background-color: transparent;
                border: 1px solid #eee;
            }
            .content-right {
                width: 100%;
                display: block;
            }
            .lifestyle-box {
                background-color: transparent;
            }
            .app-expectations {
                background-color: transparent;
            }
        }
    </style>
</head>
